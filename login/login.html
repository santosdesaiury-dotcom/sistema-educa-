<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AVA-EDUCA+</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="./login.css">
</head>

<body class="login-body">
    <div class="login-card">
        <h1>AVA-EDUCA+</h1>
        <p>Acesse sua conta de professor</p>
        <form id="formLogin">
            <div class="form-group">
                <label>E-mail</label>
                <input type="email" id="email" required placeholder="ana.silva@educa.com">
            </div>
            <div class="form-group">
                <label>Senha</label>
                <input type="password" id="senha" required placeholder="123456">
            </div>
            <button class="btn" type="submit">Entrar</button>
            <div id="feedback" class="feedback"></div>
            <a href="#" id="forgot">Esqueceu sua senha?</a>
            <small style="display:block;margin-top:12px;color:#666">Teste: ana.silva@educa.com / 123456</small>
        </form>
    </div>
    <script type="module" src="./login.js"></script>
</body>

</html>
