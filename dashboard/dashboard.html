<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - AVA-EDUCA+</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="./dashboard.css">
</head>

<body>

  <header class="toolbar">
    <div class="logo">AVA-EDUCA+</div>
    <div class="user" id="userName">Carregando...</div>
  </header>

  <div class="layout">
    <nav class="sidebar">
      <a href="./dashboard.html" class="active">Dashboard</a>
      <a href="#" id="linkCursos" title="Em construção">Cursos</a>
      <a href="../cadastro-aluno/cadastro-aluno.html">Cadastro de Alunos</a>
      <button id="btnSair">Sair</button>
    </nav>

    <main class="content">

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 25px;">
        <div style="background: white; padding: 20px; border-radius: 12px; border-left: 5px solid #2a3b8f;">
          <p style="margin:0; color:#666;">Total de Alunos</p>
          <h2 id="total-alunos" style="margin:5px 0 0 0; font-size:32px; color:#2a3b8f;">0</h2>
        </div>
        <div style="background: white; padding: 20px; border-radius: 12px; border-left: 5px solid #2a3b8f;">
          <p style="margin:0; color:#666;">Total de Cursos</p>
          <h2 id="total-cursos" style="margin:5px 0 0 0; font-size:32px; color:#2a3b8f;">2</h2>
        </div>
      </div>

      <h2>Meus Cursos</h2>
      <div id="cards" class="cards"></div>
      <div id="feedback" class="feedback"></div>
    </main>
  </div>

  <script type="module" src="./dashboard.js"></script>
</body>

</html>
