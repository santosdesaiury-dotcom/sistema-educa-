<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Aluno - AVA-EDUCA+</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="./cadastro-aluno.css">
</head>
<body>
  <header style="background:#1e3a8a; color:white; padding:15px; display:flex; justify-content:space-between;">
    <span>AVA-EDUCA+</span>
    <span>Prof. Ana Silva</span>
  </header>
  <div style="display:flex;">
    <nav style="width:200px; background:#f8f9fa; min-height:100vh; padding:20px;">
      <p><a href="../dashboard/dashboard.html" style="text-decoration:none; color:#333;">Dashboard</a></p>
      <p><a href="#" id="linkCursos" style="text-decoration:none; color:#333;">Cursos</a></p>
      <p style="background:#1e3a8a; padding:10px; border-radius:5px;"><a href="#" style="text-decoration:none; color:white;">Cadastro de Alunos</a></p>
      <p><a href="#" id="btnSair" style="text-decoration:none; color:#333;">Sair</a></p>
    </nav>

    <main style="flex:1; padding:20px; background:#eef2f7;">
      <h2>Cadastro de Aluno</h2>
      <div style="background:white; padding:20px; border-radius:8px;">
        <form id="formAluno">
          <div class="form-grid">
            <div><label>Nome Completo * (4 a 80)</label><input type="text" id="nomeCompleto" placeholder="Ex: João da Silva" required></div>
            <div><label>Gênero *</label><select id="genero" required><option value="">Selecione</option><option value="Masculino">Masculino</option><option value="Feminino">Feminino</option><option value="Outro">Outro</option></select></div>
            <div><label>Data Nascimento * DD/MM/YYYY</label><input type="text" id="dataNascimento" placeholder="DD/MM/YYYY" required></div>
            <div><label>CPF * (somente números)</label><input type="text" id="cpf" placeholder="Somente números" required></div>
            <div><label>Telefone * (somente números)</label><input type="text" id="telefone" required></div>
            <div><label>E-mail *</label><input type="email" id="email" required></div>
            <h3 class="full" style="color:#1e3a8a; margin:10px 0 0 0;">Endereço</h3>
            <div><label>CEP * (somente números)</label><input type="text" id="cep" placeholder="Ex: 89010000" required></div>
            <div><label>Cidade *</label><input type="text" id="cidade" required></div>
            <div><label>Estado *</label><input type="text" id="estado" required></div>
            <div><label>Logradouro *</label><input type="text" id="logradouro" required></div>
            <div><label>Número *</label><input type="text" id="numero" required></div>
            <div><label>Complemento</label><input type="text" id="complemento"></div>
            <div class="full"><label>Bairro *</label><input type="text" id="bairro" required></div>
          </div>
          <button type="submit" style="width:100%; margin-top:20px; background:#1e3a8a; color:white; padding:12px; border:none; border-radius:5px; cursor:pointer; font-weight:bold;">Salvar Aluno</button>
          <div id="feedback"></div>
        </form>

        <div id="lista-container" style="margin-top:40px; border-top:2px solid #eee; padding-top:20px;">
          <h3>Alunos Cadastrados (<span id="qtdLista">0</span>)</h3>
          <table style="width:100%; margin-top:15px; border-collapse: collapse;">
            <thead>
              <tr style="background:#f0f0f0; text-align:left;">
                <th style="padding:10px; border:1px solid #ddd;">Nome</th>
                <th style="padding:10px; border:1px solid #ddd;">CPF</th>
                <th style="padding:10px; border:1px solid #ddd;">E-mail</th>
                <th style="padding:10px; border:1px solid #ddd;">Cidade</th>
              </tr>
            </thead>
            <tbody id="listaAlunos"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
  <script type="module" src="./cadastro-aluno.js"></script>
</body>
</html>
